.vtl .ph{position:absolute;top:0;bottom:0;width:.35cqw;background:#fff;left:6%;animation:playhead 7s linear infinite}
.wv{display:flex;align-items:center;gap:.5cqw;height:3cqw;margin-left:var(--l,0)}.wv i{display:block;width:.5cqw;border-radius:.3cqw;background:var(--pink);height:var(--h)}
.svcs{position:relative;margin:-30px 16px 0;background:rgba(9,13,44,.94);border:1px solid rgba(255,255,255,.14);border-radius:24px;padding:6px 26px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.svc{padding:22px 0;border-bottom:1px solid rgba(255,255,255,.1)}.svc:last-child{border-bottom:0}
.svc-h{display:flex;justify-content:space-between;align-items:flex-start;gap:18px}
.svc h3{font:700 1.2rem/1.25 var(--disp);letter-spacing:-.01em}
.svc-meta{font-size:.78rem;color:var(--mutd);margin-top:5px;font-weight:600}
.svc-p{font:800 1.9rem/1 var(--disp);letter-spacing:-.04em;white-space:nowrap;text-align:right}.svc-p small{display:block;font:600 .72rem var(--font);letter-spacing:0;color:var(--mutd);margin-top:6px}
.svc p.o{font-size:.92rem;color:var(--mutd);margin:12px 0 16px;max-width:54ch}
.svc-act{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.svc-act .btn-s{flex:0 1 auto;min-width:130px}
/* KONSEPT ÇALIŞMALAR */
.work{background:radial-gradient(60vmax 40vmax at 0 0,rgba(124,58,237,.24),transparent 60%),var(--navy);padding:clamp(72px,9vw,120px) 0}
.work .title{max-width:15ch}
.note{display:inline-flex;gap:10px;align-items:center;margin-top:18px;padding:10px 16px;border-radius:14px;background:rgba(255,255,255,.06);border:1px dashed rgba(255,255,255,.28);font-size:.88rem;color:var(--mutd)}.note .i{color:var(--pink)}
.bento{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:20px;margin-top:clamp(36px,5vw,60px)}
.cn{position:relative;border-radius:30px;overflow:hidden;container-type:inline-size;isolation:isolate;background:#0b1038;color:#fff;min-height:340px;transform:translateZ(0)}
.cn.a{grid-column:span 7;aspect-ratio:16/11}.cn.b{grid-column:span 5;aspect-ratio:auto}.cn.c,.cn.d,.cn.e{grid-column:span 4;aspect-ratio:1/1.08}
.cn-art{position:absolute;inset:0;transition:transform 1.2s var(--ease)}
.cn:hover .cn-art{transform:scale(1.03)}
.cn-cap{position:absolute;left:0;right:0;bottom:0;padding:clamp(18px,3cqw,30px);background:linear-gradient(transparent,rgba(5,7,26,.92) 55%);z-index:2}
.tag-c{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#fde68a;border:1px solid rgba(253,230,138,.55);padding:3px 10px;border-radius:99px;margin-bottom:10px}
.cn-cap h3{font:800 clamp(1.15rem,3.2cqw,1.7rem)/1.1 var(--disp);letter-spacing:-.03em}.cn-cap p{font-size:.88rem;color:#c3c8e6;margin-top:6px;max-width:44ch}
.a1{background:radial-gradient(60% 70% at 78% 18%,rgba(217,70,239,.5),transparent 60%),radial-gradient(60% 60% at 10% 100%,rgba(124,58,237,.7),transparent 60%),#0a0f2e}
.a1 .big{position:absolute;left:6cqw;top:9cqw;font:800 15cqw/.86 var(--disp);letter-spacing:-.06em;color:#fff}.a1 .big span{display:block;color:transparent;-webkit-text-stroke:.25cqw rgba(255,255,255,.8)}
.a1 .nvb{position:absolute;left:6cqw;right:6cqw;top:3cqw;height:1.2cqw;display:flex;justify-content:space-between}.a1 .nvb i{display:block;width:8cqw;height:1.2cqw;border-radius:1cqw;background:rgba(255,255,255,.3)}
.a1 .prod{position:absolute;border-radius:50%}
.a1 .p1{right:8cqw;top:8cqw;width:26cqw;height:26cqw;background:radial-gradient(circle at 30% 30%,#fbcfe8,#c026d3 60%,#4c1d95);box-shadow:0 4cqw 8cqw rgba(0,0,0,.5)}
.a1 .p2{right:30cqw;top:24cqw;width:15cqw;height:15cqw;background:radial-gradient(circle at 30% 30%,#fde68a,#f59e0b 60%,#92400e);box-shadow:0 3cqw 6cqw rgba(0,0,0,.5)}
.a1 .p3{right:3cqw;top:32cqw;width:11cqw;height:11cqw;background:radial-gradient(circle at 30% 30%,#a5f3fc,#0891b2 60%,#164e63);box-shadow:0 3cqw 6cqw rgba(0,0,0,.5)}
.a1 .tagp{position:absolute;right:12cqw;top:4cqw;background:#fff;color:#14122e;font:800 2.4cqw var(--disp);padding:.8cqw 2cqw;border-radius:99px}
.a1 .cta2{position:absolute;left:6cqw;top:40cqw;padding:1.4cqw 3.4cqw;border-radius:99px;background:var(--grad);font:700 2.2cqw var(--font)}
.b1{background:#f6f7fb;color:#14122e}
.b1 .mast{position:absolute;left:7cqw;right:7cqw;top:6cqw;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #14122e;padding-bottom:3cqw;font:800 4cqw var(--disp);letter-spacing:-.04em}.b1 .mast i{display:block;width:12cqw;height:2cqw;border-radius:2cqw;background:#c5c9e2}
.b1 .hd{position:absolute;left:7cqw;right:7cqw;top:22cqw;font:800 11cqw/.95 var(--disp);letter-spacing:-.05em}
